<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Un comercio en Salvá</title>
<meta property="og:title" content="Este comercio está en Salvá">
<meta property="og:description" content="Lo que le sobra al cierre, a precio rebajado. Reservalo en la app y retiralo en el local.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Salvá">
<meta property="og:locale" content="es_AR">
<meta property="og:image" content="https://salvaapp.com.ar/compartir.jpg">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="500">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="estilo.css">
<!-- La dirección del App Store (window.SALVA_APP_STORE) vive en tiendas.js.
     Con defer corre antes del DOMContentLoaded de abajo. -->
<script src="tiendas.js" defer></script>
<style>
  .botones { display: grid; gap: 10px; margin: 20px 0 8px; }
  .boton { display: block; text-align: center; padding: 14px 16px; border-radius: 14px;
           font-weight: 700; text-decoration: none; font-size: 16px; }
  .boton.play { padding: 18px 16px; font-size: 18px; background: #06245E; color: #fff; }
  .boton.borde { border: 1px solid var(--borde, #DDE6F1); color: #0868DB; }
  [hidden] { display: none !important; }
</style>
<script>
  // Esta página es el destino del link y del QR del cartel que el comercio
  // pega en la caja. Trae el id del comercio.
  //
  // Las etiquetas de arriba son las genéricas: con el Worker de Cloudflare
  // delante (cloudflare/compartir en el repo de la app, 1020) se cambian por
  // las de este local —nombre, foto, cuántas ofertas tiene— para la vista
  // previa de WhatsApp.
  //
  // No se salta solo a la app: el QR lo escanea sobre todo gente que todavía
  // no la tiene, y un salto que falla deja la pantalla en blanco un segundo
  // antes de mostrar nada. El salto es el botón.
  var PAQUETE = 'com.oportia.salva';
  var UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  // El id del local en el referrer: Play lo guarda con la instalación, y así
  // se ve cuánta gente trae cada cartel.
  function play(id) {
    return 'https://play.google.com/store/apps/details?id=' + PAQUETE +
      '&referrer=' + encodeURIComponent('utm_source=compartir&utm_medium=local' +
        (id ? '&utm_content=' + id : ''));
  }
  // iPhone y iPad (los iPad nuevos se presentan como Mac con pantalla
  // táctil): ahí el botón de bajar va al App Store. La ficha de Apple no
  // tiene referrer, así que de iPhone no se sabe qué cartel trajo a quién.
  var IOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
            (/Macintosh/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
  var ANDROID = /Android/i.test(navigator.userAgent);

  document.addEventListener('DOMContentLoaded', function () {
    var id = new URLSearchParams(location.search).get('id') || '';
    var valido = UUID.test(id);
    var bajar = document.getElementById('bajar');
    bajar.href = play(valido ? id : '');
    if (IOS) {
      var appStore = window.SALVA_APP_STORE || '';
      // Sin la dirección (tiendas.js no cargó), mejor sin botón que uno que
      // mande a Play desde un iPhone.
      if (appStore) {
        bajar.href = appStore;
        bajar.textContent = 'Bajala del App Store';
      } else {
        bajar.hidden = true;
      }
    }
    if (!valido) return;
    var abrir = document.getElementById('abrir');
    var camino = 'comercio/' + encodeURIComponent(id);
    // En Android, `intent:` abre la app si está y, si no, Play; con
    // `salva://` solo, sin la app no pasaba nada.
    abrir.href = ANDROID
      ? 'intent://' + camino + '#Intent;scheme=salva;package=' + PAQUETE +
        ';S.browser_fallback_url=' + encodeURIComponent(play(id)) + ';end'
      : 'salva://' + camino;
    if (IOS) abrir.textContent = 'Ya tengo la app: abrir';
    abrir.hidden = false;
  });
</script>
</head>
<body>
<main>
  <h1 style="margin-top:56px">Este comercio está en Salvá</h1>
  <div class="tarjeta">
    <p style="margin-top:0">Cuando le sobra algo al cierre, lo publica en
    <strong>Salvá</strong> a precio rebajado. Seguilo en la app y enterate
    apenas aparece: lo reservás, lo pagás y lo retirás acá.</p>
  </div>
  <div class="botones">
    <a class="boton lleno play" id="bajar" href="https://play.google.com/store/apps/details?id=com.oportia.salva">Descargar en Google Play</a>
    <a class="boton borde" id="abrir" hidden href="#">Abrir en la app</a>
  </div>
</main>
<footer>Salvá · <a href="privacidad.html">Privacidad</a> · <a href="terminos.html">Términos</a></footer>
</body>
</html>
